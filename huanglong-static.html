<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yellow Dragon Pools — a view of Huanglong</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  :root {
    --lacquer: #241b13;
    --silk-hint: #c7a878;
  }
  html, body { margin: 0; padding: 0; background: var(--lacquer); }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--silk-hint);
    padding: 28px 16px;
    box-sizing: border-box;
  }
  header { text-align: center; margin-bottom: 18px; letter-spacing: 0.06em; }
  header h1 { font-size: 15px; font-weight: normal; margin: 0; opacity: 0.9; }
  header p  { font-size: 11px; margin: 6px 0 0; opacity: 0.5; font-style: italic; }
  #holder { max-width: 1100px; width: 100%; box-shadow: 0 18px 60px rgba(0,0,0,0.55); }
  #holder canvas { display: block; width: 100% !important; height: auto !important; }
</style>
</head>
<body>
<header>
  <h1>yellow dragon pools &mdash; huanglong, after Wang Ximeng</h1>
  <p>a still view of the valley</p>
</header>
<div id="holder"></div>

<script>
// ---------------------------------------------------------------
// A single fixed composition of the Huanglong valley, painted in
// blue-green (qinglü) mineral pigments: forested slopes flank a
// misty basin; the temple sits at its head; terraced turquoise
// pools fan toward the viewer. Deterministic — one view, held.
// ---------------------------------------------------------------

const W = 1200, H = 820;
const SEED = 1113;
let ctx;

// palette — mineral pigments on aged silk
const P = {
  silk:       [199, 168, 118],
  silkDark:   [170, 138, 92],
  azurite:    [ 32,  92, 116],   // shiqing 石青
  malachite:  [ 82, 138, 102],   // shilü 石绿
  ochre:      [168, 126,  74],   // zheshi 赭石
  ink:        [ 46,  52,  48],
  haze:       [214, 190, 148],
  seal:       [172,  48,  38],
  travertine: [210, 182, 130],
  rim:        [178, 134,  74],
  poolPale:   [150, 202, 180],
  poolMid:    [ 64, 164, 152],
  poolDeep:   [ 22, 110, 130],
};

const BASIN = 0.55;              // where the valley floor begins

function col(a, alpha = 255) { return color(a[0], a[1], a[2], alpha); }
function css(a, alpha = 1)   { return `rgba(${a[0]},${a[1]},${a[2]},${alpha})`; }

function setup() {
  const c = createCanvas(W, H);
  c.parent('holder');
  pixelDensity(Math.min(2, window.devicePixelRatio || 1));
  ctx = drawingContext;
  noLoop();
}

function draw() {
  randomSeed(SEED);
  noiseSeed(SEED);

  paintSilk();
  paintFarPeaks();
  paintCloudSea();

  // flanking slopes, far pair then near pair, converging on the valley
  paintFlank(-1, 0.14, 0.46, 0.50, 0.42, 11);   // far left
  paintFlank( 1, 0.10, 0.55, 0.48, 0.38, 23);   // far right
  paintFlank(-1, 0.30, 0.40, 0.56, 0.10, 47);   // near left
  paintFlank( 1, 0.26, 0.62, 0.55, 0.08, 61);   // near right

  paintBasin();

  paintPools();
  paintTemple(width * 0.50, height * 0.548);

  paintMistBand();
  paintGrain();
  paintSeal();
}

// ----------------------------------------------------- silk ground
function paintSilk() {
  for (let y = 0; y < height; y++) {
    const t = y / height;
    const c = lerpColor(col(P.silkDark), col(P.silk), 0.35 + 0.65 * t);
    stroke(c); line(0, y, width, y);
  }
  noStroke();
  for (let k = 0; k < 90; k++) {
    const x = random(width), y = random(height);
    const r = random(40, 190);
    const lighten = random() < 0.5;
    fill(lighten ? color(224, 198, 150, 7) : color(120, 92, 58, 6));
    ellipse(x, y, r * random(1, 2.4), r);
  }
  // drifting haze in the sky
  for (let k = 0; k < 4; k++) {
    const y = random(height * 0.04, height * 0.22);
    for (let dy = -14; dy <= 14; dy++) {
      const a = 13 * cos((dy / 14) * HALF_PI);
      stroke(P.haze[0], P.haze[1], P.haze[2], a);
      line(0, y + dy, width, y + dy);
    }
  }
}

// -------------------------------- distant peaks at the valley head
function paintFarPeaks() {
  const baseline = height * 0.455;
  const hazeMix = 0.74;
  for (let x = 0; x <= width; x += 2) {
    let r = 1 - abs(2 * noise(x * 0.006 + 300.5) - 1);
    r = pow(r, 2.1);
    const h = 115 * r * pow(noise(x * 0.0022 + 90.1), 1.5) + 6;
    const y0 = baseline - h;

    let peak = lerpColor(col(P.azurite), col(P.malachite), noise(x * 0.004 + 7.7));
    peak = lerpColor(peak, col(P.haze), hazeMix);
    // dissolve quickly: peaks floating on cloud, not a wall
    const g = ctx.createLinearGradient(0, y0, 0, y0 + h * 0.9 + 12);
    g.addColorStop(0, peak.toString());
    g.addColorStop(0.65, css(P.haze, 0.85));
    g.addColorStop(1, css(P.haze, 0));
    ctx.fillStyle = g;
    ctx.fillRect(x, y0, 2, h * 0.9 + 12);
  }
}

// ------------------------- cloud sea hanging between the two flanks
function paintCloudSea() {
  const yc = height * 0.46;
  for (let y = yc - 75; y <= yc + 60; y++) {
    const u = (y - (yc - 75)) / 135;
    const bell = sin(constrain(u, 0, 1) * PI);
    for (let x = 0; x < width; x += 4) {
      const wisp = noise(x * 0.004, y * 0.02);
      if (wisp < 0.32) continue;
      stroke(P.haze[0] + 10, P.haze[1] + 12, P.haze[2] + 14, 88 * bell * wisp);
      line(x, y, x + 4, y);
    }
  }
}

// ------------------------------------------------- flanking slope
// side: -1 left, +1 right. Ridge falls from the canvas edge
// (yEdge, fraction of H) to the valley at (xInner, yInner).
function paintFlank(side, yEdge, xInner, yInner, hazeMix, k) {
  const xEdge = side < 0 ? 0 : width;
  const xi = width * xInner;
  const span = abs(xi - xEdge);
  const baseline = height * 0.66;

  const ridge = new Float32Array(width + 1).fill(NaN);
  for (let x = 0; x <= width; x++) {
    const p = abs(x - xEdge) / span;            // 0 at edge, 1 at valley
    if (p > 1.55) continue;
    // past the valley end the spur keeps diving, sinking under
    // the basin mist instead of stopping in a hard seam
    const spine = p <= 1
      ? lerp(height * yEdge, height * yInner, pow(p, 1.25))
      : lerp(height * yInner, height * 0.78, (p - 1) / 0.55);
    let r = 1 - abs(2 * noise(x * 0.006 + k * 113.3) - 1);
    r = pow(r, 1.6);
    let r2 = 1 - abs(2 * noise(x * 0.016 + k * 71.9) - 1);
    r2 = pow(r2, 1.8);
    const amp = lerp(95, 5, constrain(pow(p, 0.75), 0, 1));
    ridge[x] = spine - (r + 0.45 * r2) * amp - noise(x * 0.02 + k * 3.1) * 16;
  }

  // per-column pigment gradient down the face
  for (let x = 0; x <= width; x += 2) {
    if (isNaN(ridge[x])) continue;
    const y0 = ridge[x];
    if (baseline - y0 < 2) continue;

    const blend = noise(x * 0.0035 + k * 19.7);
    let peak = lerpColor(col(P.azurite), col(P.malachite), blend);
    peak = lerpColor(peak, col(P.haze), hazeMix);
    const mid = lerpColor(col(P.ochre), col(P.haze), hazeMix * 0.8);

    const fade = baseline - y0 + 50;
    const g = ctx.createLinearGradient(0, y0, 0, y0 + fade);
    g.addColorStop(0.00, peak.toString());
    g.addColorStop(0.55, css([red(mid), green(mid), blue(mid)], 1));
    g.addColorStop(0.84, css(P.silk, 1));
    g.addColorStop(1.00, css(P.silk, 0));
    ctx.fillStyle = g;
    ctx.fillRect(x, y0, 2, fade);
  }

  // ink contour along the ridge
  const near = hazeMix < 0.2;
  strokeWeight(near ? 1.1 : 0.7);
  stroke(P.ink[0], P.ink[1], P.ink[2], near ? 85 : 34);
  noFill();
  beginShape();
  for (let x = 0; x <= width; x += 3) {
    if (!isNaN(ridge[x])) vertex(x, ridge[x]);
  }
  endShape();

  // cun 皴 strokes, short and quiet, hugging the ridge
  stroke(P.ink[0], P.ink[1], P.ink[2], near ? 24 : 10);
  strokeWeight(0.6);
  for (let x = 6; x < width - 6; x += 5) {
    if (isNaN(ridge[x])) continue;
    const hHere = baseline - ridge[x];
    if (hHere > 40 && random() < 0.5) {
      const len = random(6, min(hHere * 0.25, 26));
      line(x, ridge[x] + 3, x + random(-3, 3), ridge[x] + 3 + len);
    }
  }

  // mist licking the base of the slope
  const mistTop = baseline - 40;
  for (let y = mistTop; y < baseline + 20 && y < height; y++) {
    const a = 34 * sin(map(y, mistTop, baseline + 20, 0, PI));
    stroke(P.haze[0], P.haze[1], P.haze[2], a);
    line(0, y, width, y);
  }
}

// ---------------------------------------- calcite basin under pools
function paintBasin() {
  const top = height * BASIN;
  for (let y = top; y < height; y++) {
    const t = (y - top) / (height - top);
    const c = lerpColor(col(P.haze), col(P.travertine), constrain(t * 1.4, 0, 1));
    stroke(red(c), green(c), blue(c), lerp(60, 200, t));
    line(0, y, width, y);
  }
  strokeWeight(0.7);
  for (let k = 0; k < 260; k++) {
    const x = random(width);
    const y = random(top + 20, height);
    const t = (y - top) / (height - top);
    const len = random(4, 22) * (0.4 + t);
    stroke(P.rim[0], P.rim[1], P.rim[2], random(10, 34));
    line(x, y, x + random(-3, 3), y + len);
  }
}

// ------------------------------------------------- terraced pools
function blobPts(cx, cy, rx, ry, k) {
  const pts = [];
  const n = 48;
  for (let j = 0; j < n; j++) {
    const a = TWO_PI * j / n;
    const w = 0.70 + 0.58 * noise(cos(a) * 1.25 + k, sin(a) * 1.25 + k * 1.7);
    pts.push([cx + cos(a) * rx * w, cy + sin(a) * ry * w]);
  }
  return pts;
}

function blobShape(pts, scale = 1, cx = 0, cy = 0, dy = 0) {
  beginShape();
  for (let j = 0; j < pts.length + 3; j++) {
    const [px, py] = pts[j % pts.length];
    curveVertex(cx + (px - cx) * scale, cy + (py - cy) * scale + dy);
  }
  endShape(CLOSE);
}

// Pools are painted in three passes per row (walls, then waters,
// then rims) with rows stacked near to far. Same-row neighbours
// erase each other's lateral walls, so walls survive only along the
// row's downhill front — each terrace steps visibly onto the row
// below without any pool reading as a floating disc.
function makePool(cx, cy, rx, ry, t) {
  return {
    cx, cy, rx, ry, t,
    k: random(1000),
    pts: blobPts(cx, cy, rx, ry, random(1000)),
    wallH: lerp(4, 30, t) * random(0.85, 1.2),
    deepBlend: random(0.45, 1),
    hazeMix: lerp(0.42, 0, pow(t, 0.8)),        // far pools dissolve
    w: lerp(2.5, 9, t),                          // rim ridge width
  };
}

// pass 1 — flowstone wall dropping from the downhill edge
function poolWall(p) {
  const { pts, cy, ry, t, k, wallH, hazeMix } = p;
  const n = pts.length;
  const wallTop = lerpColor(color(P.rim[0] + 34, P.rim[1] + 30, P.rim[2] + 20, 245), col(P.haze), hazeMix);
  const wallBot = lerpColor(color(P.rim[0] - 58, P.rim[1] - 50, P.rim[2] - 36, 245), col(P.haze), hazeMix);
  const j0 = floor(n * 0.04), j1 = ceil(n * 0.46);
  const foot = [];
  ctx.save();
  ctx.beginPath();
  for (let j = j0; j <= j1; j++) {
    const [px, py] = pts[j % n];
    j === j0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  for (let j = j1; j >= j0; j--) {
    const [px, py] = pts[j % n];
    const h = wallH * (0.7 + 0.6 * noise(px * 0.05, k * 2.3));
    foot.push([px, py + h]);
    ctx.lineTo(px, py + h);
  }
  ctx.closePath();
  const wg = ctx.createLinearGradient(0, cy + ry * 0.55, 0, cy + ry + wallH);
  wg.addColorStop(0, wallTop.toString());
  wg.addColorStop(1, wallBot.toString());
  ctx.fillStyle = wg;
  ctx.fill();
  ctx.restore();

  // contact shadow grounding the wall on the terrace below
  noFill();
  stroke(P.ink[0], P.ink[1], P.ink[2], lerp(16, 52, t));
  strokeWeight(lerp(0.8, 1.6, t));
  beginShape();
  for (const [px, py] of foot) curveVertex(px, py + 0.5);
  endShape();

  // drip texture running down the wall
  if (t > 0.25) {
    stroke(P.rim[0] - 30, P.rim[1] - 28, P.rim[2] - 20, 70);
    strokeWeight(0.6);
    for (let j = j0; j <= j1; j += 2) {
      const [px, py] = pts[j % n];
      if (random() < 0.6) line(px, py + 1, px + random(-1.5, 1.5), py + wallH * random(0.5, 0.9));
    }
  }
}

// pass 2 — water: smooth radial gradient, pale edge to deep centre
function poolWater(p) {
  const { pts, cx, cy, rx, ry, deepBlend, hazeMix } = p;
  const deepC = lerpColor(lerpColor(col(P.poolMid), col(P.poolDeep), deepBlend), col(P.haze), hazeMix);
  const midC  = lerpColor(lerpColor(col(P.poolMid), col(P.poolPale), 0.3), col(P.haze), hazeMix);
  const paleC = lerpColor(col(P.poolPale), col(P.haze), hazeMix);
  ctx.save();
  ctx.beginPath();
  for (let j = 0; j < pts.length; j++) {
    j ? ctx.lineTo(pts[j][0], pts[j][1]) : ctx.moveTo(pts[j][0], pts[j][1]);
  }
  ctx.closePath();
  ctx.clip();
  ctx.translate(cx, cy);
  ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, -rx * 0.14, rx * 0.05, 0, -rx * 0.14, rx * 1.18);
  g.addColorStop(0.00, deepC.toString());
  g.addColorStop(0.55, midC.toString());
  g.addColorStop(0.88, paleC.toString());
  g.addColorStop(1.00, paleC.toString());
  ctx.fillStyle = g;
  ctx.fillRect(-rx * 1.6, -rx * 1.6, rx * 3.2, rx * 3.2);
  ctx.restore();
}

// pass 3 — recessed-water shadow, calcite ridge, ripples
function poolRim(p) {
  const { pts, cx, cy, rx, ry, t, w, hazeMix } = p;
  const n = pts.length;

  // the water sits recessed: a shadow tucked under the uphill rim
  noFill();
  stroke(P.ink[0], P.ink[1] + 8, P.ink[2] + 6, lerp(18, 42, t));
  strokeWeight(w * 1.1);
  beginShape();
  for (let j = floor(n * 0.56); j <= n * 0.94; j++) {
    const [px, py] = pts[j % n];
    curveVertex(px, py + w * 0.55);
  }
  endShape();

  // calcite ridge straddling the water's edge: pale bed, golden
  // crest, then the painter's ink line
  stroke(lerpColor(color(226, 200, 148, 240), col(P.haze), hazeMix));
  strokeWeight(w);
  blobShape(pts, 1.0, cx, cy);

  stroke(lerpColor(color(P.rim[0], P.rim[1], P.rim[2], 190), col(P.haze), hazeMix));
  strokeWeight(w * 0.45);
  blobShape(pts, 1.0, cx, cy);

  stroke(P.ink[0], P.ink[1], P.ink[2], lerp(26, 70, t));
  strokeWeight(lerp(0.5, 1.0, t));
  blobShape(pts, 1.0, cx, cy);

  // still-water ripples, kept well inside the rim
  stroke(230, 240, 226, lerp(24, 52, t));
  strokeWeight(0.7);
  for (let r = 0; r < 3; r++) {
    const yy = cy + random(-0.25, 0.3) * ry;
    const half = rx * random(0.18, 0.42);
    line(cx - half, yy, cx + half, yy + random(-0.8, 0.8));
  }
}

// pools fan out from the valley head toward the viewer,
// meandering slightly as the terraces step down
function paintPools() {
  const rows = 7;
  for (let i = rows - 1; i >= 0; i--) {
    const t = i / (rows - 1);                    // 0 = far, 1 = near
    const y = lerp(height * 0.578, height * 0.995, pow(t, 1.28));
    const sc = lerp(0.36, 2.0, t);               // perspective scale
    // fan opens wide enough that mid and near rows run edge to edge
    const hw = width * lerp(0.13, 0.80, pow(t, 0.85));
    const cxRow = width * (0.5 + 0.04 * sin(t * 4.2 + 0.6));

    const row = [];
    let x = cxRow - hw + random(-30, 10);
    while (x < cxRow + hw) {
      const rx = random(55, 140) * sc;
      const ry = rx * random(0.24, 0.31);        // flat dishes: walls stay exposed
      if (random() < 0.05) { x += rx * random(1.3, 1.7); continue; }
      row.push(makePool(x + rx * 0.6, y + random(-0.35, 0.35) * ry, rx, ry, t));
      x += rx * random(0.75, 1.15);              // rims merge into one sheet
    }

    // walls first (same-row waters erase the lateral ones), then
    // water+rim interleaved so a later neighbour's water swallows
    // the overlapped stretch of the earlier rim — one shared ridge
    for (const p of row) poolWall(p);
    for (const p of row) { poolWater(p); poolRim(p); }
  }
}

// --------------------------------------------------------- temple
function paintTemple(x, y) {
  const w = 62, wall = 18;

  noStroke();
  fill(P.ink[0], P.ink[1], P.ink[2], 190);
  rect(x - w * 0.3, y - wall, w * 0.6, wall);
  stroke(P.silk[0], P.silk[1], P.silk[2], 150);
  strokeWeight(1.5);
  for (let c = -1; c <= 1; c++) line(x + c * w * 0.18, y - wall + 3, x + c * w * 0.18, y - 1);

  // sweeping roof with upturned eaves
  noStroke();
  fill(P.ochre[0] - 30, P.ochre[1] - 30, P.ochre[2] - 24, 230);
  beginShape();
  vertex(x - w * 0.58, y - wall + 1);
  quadraticVertex(x - w * 0.30, y - wall - 9, x, y - wall - 13);
  quadraticVertex(x + w * 0.30, y - wall - 9, x + w * 0.58, y - wall + 1);
  quadraticVertex(x + w * 0.30, y - wall - 5, x, y - wall - 8);
  quadraticVertex(x - w * 0.30, y - wall - 5, x - w * 0.58, y - wall + 1);
  endShape(CLOSE);
  fill(P.seal[0], P.seal[1], P.seal[2], 200);
  rect(x - 1.3, y - wall - 18, 2.6, 6);

  noFill();
  stroke(P.ink[0], P.ink[1], P.ink[2], 160);
  strokeWeight(0.8);
  beginShape();
  vertex(x - w * 0.58, y - wall + 1);
  quadraticVertex(x - w * 0.30, y - wall - 9, x, y - wall - 13);
  quadraticVertex(x + w * 0.30, y - wall - 9, x + w * 0.58, y - wall + 1);
  endShape();
}

// -------------------------------- mist where basin meets mountains
function paintMistBand() {
  const yc = height * BASIN;
  for (let dy = -34; dy <= 40; dy++) {
    const a = 40 * cos((dy / (dy < 0 ? 34 : 40)) * HALF_PI);
    stroke(P.haze[0], P.haze[1], P.haze[2], max(a, 0));
    line(0, yc + dy, width, yc + dy);
  }
}

// ------------------------------------------------- grain + vignette
function paintGrain() {
  for (let y = 0; y < height; y += 3) {
    stroke(90, 70, 45, 5);
    line(0, y, width, y);
  }
  strokeWeight(1);
  for (let k = 0; k < 5200; k++) {
    const x = random(width), y = random(height);
    stroke(random() < 0.5 ? color(60, 45, 26, random(4, 14))
                          : color(230, 208, 160, random(4, 12)));
    point(x, y);
  }
  const g = ctx.createLinearGradient(0, 0, 0, height);
  g.addColorStop(0, 'rgba(60,42,22,0.30)');
  g.addColorStop(0.10, 'rgba(60,42,22,0)');
  g.addColorStop(0.92, 'rgba(60,42,22,0)');
  g.addColorStop(1, 'rgba(60,42,22,0.30)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, width, height);
  const gx = ctx.createLinearGradient(0, 0, width, 0);
  gx.addColorStop(0, 'rgba(60,42,22,0.26)');
  gx.addColorStop(0.04, 'rgba(60,42,22,0)');
  gx.addColorStop(0.96, 'rgba(60,42,22,0)');
  gx.addColorStop(1, 'rgba(60,42,22,0.26)');
  ctx.fillStyle = gx; ctx.fillRect(0, 0, width, height);
}

// ------------------------------------------------------ collector seal
function paintSeal() {
  const s = 26;
  const x = width - 54, y = height * 0.10;
  noStroke();
  fill(P.seal[0], P.seal[1], P.seal[2], 216);
  rect(x, y, s, s, 2.5);
  stroke(P.silk[0], P.silk[1], P.silk[2], 235);
  strokeWeight(1.6);
  noFill();
  line(x + 6,  y + 6,  x + 6,  y + 20);
  line(x + 6,  y + 13, x + 12, y + 13);
  line(x + 12, y + 6,  x + 12, y + 20);
  line(x + 17, y + 6,  x + 21, y + 6);
  line(x + 19, y + 6,  x + 19, y + 16);
  line(x + 16, y + 20, x + 21, y + 16);
}
</script>
</body>
</html>
