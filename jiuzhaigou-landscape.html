<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jiuzhaigou — generative shanshui</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  :root {
    --lacquer: #1e1a14;
    --silk-hint: #c7b08a;
  }
  html, body { margin: 0; padding: 0; background: var(--lacquer); }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--silk-hint);
    padding: 28px 16px;
    box-sizing: border-box;
  }
  header { text-align: center; margin-bottom: 18px; letter-spacing: 0.06em; }
  header h1 { font-size: 15px; font-weight: normal; margin: 0; opacity: 0.9; }
  header p  { font-size: 11px; margin: 6px 0 0; opacity: 0.5; font-style: italic; }
  #holder { max-width: 1400px; width: 100%; box-shadow: 0 18px 60px rgba(0,0,0,0.55); }
  #holder canvas { display: block; width: 100% !important; height: auto !important; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>jiuzhaigou in autumn &mdash; after Wang Ximeng</h1>
  <p>snow peaks, autumn forest, travertine terraces &mdash; click to repaint</p>
</header>
<div id="holder"></div>

<script>
// ------------------------------------------------------------------
// Jiuzhaigou as a blue-green handscroll:
// silk ground -> snow peaks -> autumn forest ridges -> waterfall ->
// stacked travertine pools (Five-Flower-Lake color fields, sunken
// logs, rimstone cascades) -> grain, vignette, seal
// ------------------------------------------------------------------

const W = 1400, H = 560;
let seed = 1984;                    // year Jiuzhaigou opened to visitors
let ctx;

const P = {
  silk:      [201, 174, 128],
  silkDark:  [172, 144, 100],
  snow:      [236, 238, 233],
  snowShade: [156, 176, 190],
  // travertine water — the Five Flower Lake family
  deepTeal:  [ 14,  96, 118],
  turquoise: [ 36, 148, 158],
  jade:      [ 66, 162, 128],
  paleCyan:  [138, 206, 202],
  // autumn canopy
  gold:      [214, 160,  62],
  amber:     [186, 116,  50],
  crimson:   [152,  62,  44],
  pine:      [ 58, 104,  72],
  ochre:     [168, 126,  74],
  travertine:[210, 190, 148],
  ink:       [ 44,  50,  46],
  haze:      [218, 198, 156],
  seal:      [172,  48,  38],
};

const AUTUMN = ['gold', 'amber', 'crimson', 'pine', 'pine'];

function col(a, alpha = 255) { return color(a[0], a[1], a[2], alpha); }
function css(a, alpha = 1)   { return `rgba(${a[0]},${a[1]},${a[2]},${alpha})`; }

function setup() {
  const c = createCanvas(W, H);
  c.parent('holder');
  pixelDensity(Math.min(2, window.devicePixelRatio || 1));
  ctx = drawingContext;
  noLoop();
}

function mousePressed() {
  if (mouseX >= 0 && mouseX <= width && mouseY >= 0 && mouseY <= height) {
    seed = floor(random(1e6));
    redraw();
  }
}

function draw() {
  randomSeed(seed);
  noiseSeed(seed);

  paintSilk();
  paintSnowPeaks();

  const shoreline = paintForestRidge(0, height * 0.46);   // far forest
  const shoreline2 = paintForestRidge(1, height * 0.545); // near forest / lakeshore
  paintPools(shoreline2);
  paintWaterfall(shoreline2);
  paintShoreTrees(shoreline2);

  paintGrain();
  paintSeal();
}

// ----------------------------------------------------- silk ground
function paintSilk() {
  for (let y = 0; y < height; y++) {
    const t = y / height;
    const c = lerpColor(col(P.silkDark), col(P.silk), 0.35 + 0.65 * t);
    stroke(c); line(0, y, width, y);
  }
  noStroke();
  for (let k = 0; k < 90; k++) {
    const x = random(width), y = random(height);
    const r = random(40, 190);
    fill(random() < 0.5 ? color(226, 202, 156, 7) : color(122, 96, 60, 6));
    ellipse(x, y, r * random(1, 2.4), r);
  }
}

// ------------------------------------------------------ snow peaks
function paintSnowPeaks() {
  const baseline = height * 0.36;
  const amp = height * 0.24;
  const ridge = new Float32Array(width + 1);
  for (let x = 0; x <= width; x++) {
    const env = pow(noise(x * 0.0018 + 400.5), 1.4);
    let r = 1 - abs(2 * noise(x * 0.0055 + 907.2) - 1);
    r = pow(r, 1.9);
    const detail = (noise(x * 0.03 + 55.1) - 0.5) * 0.14;
    ridge[x] = baseline - max(amp * env * (0.25 + 1.15 * r + detail), 0);
  }
  for (let x = 0; x <= width; x += 2) {
    const y0 = ridge[x];
    const hHere = baseline - y0;
    if (hHere < 2) continue;
    const shade = noise(x * 0.008 + 12.3);
    const peak = lerpColor(col(P.snow), col(P.snowShade), shade * 0.7);
    const fade = hHere + 46;
    const g = ctx.createLinearGradient(0, y0, 0, y0 + fade);
    g.addColorStop(0.00, peak.toString());
    g.addColorStop(0.55, css(P.snowShade, 0.85));
    g.addColorStop(0.85, css(P.haze, 1));
    g.addColorStop(1.00, css(P.silk, 0));
    ctx.fillStyle = g;
    ctx.fillRect(x, y0, 2, fade);
  }
  // faint ink contour + exposed rock strokes
  stroke(P.ink[0], P.ink[1], P.ink[2], 34);
  strokeWeight(0.7);
  noFill();
  beginShape();
  for (let x = 0; x <= width; x += 3) vertex(x, ridge[x]);
  endShape();
  stroke(P.snowShade[0] - 30, P.snowShade[1] - 26, P.snowShade[2] - 20, 40);
  strokeWeight(0.6);
  for (let x = 8; x < width - 8; x += 6) {
    const hHere = baseline - ridge[x];
    if (hHere > amp * 0.4 && random() < 0.4) {
      line(x, ridge[x] + 4, x + random(-4, 4), ridge[x] + 4 + random(6, hHere * 0.3));
    }
  }
  // mist at the peak bases
  for (let y = baseline - 34; y < baseline + 22; y++) {
    const a = 52 * sin(map(y, baseline - 34, baseline + 22, 0, PI));
    stroke(P.haze[0], P.haze[1], P.haze[2], a);
    line(0, y, width, y);
  }
}

// ---------------------------------------- autumn forest ridge, dabs
function paintForestRidge(i, baseline) {
  const amp = i === 0 ? height * 0.13 : height * 0.10;
  const ridge = new Float32Array(width + 1);
  for (let x = 0; x <= width; x++) {
    const env = pow(noise(x * 0.0022 + i * 71.3 + 60.6), 1.2);
    const r = pow(noise(x * 0.006 + i * 210.9), 1.1);
    ridge[x] = baseline - amp * env * (0.35 + 0.9 * r);
  }
  // under-wash: ochre body fading to silk
  for (let x = 0; x <= width; x += 2) {
    const y0 = ridge[x];
    const fade = (baseline - y0) + 40;
    if (fade < 6) continue;
    const g = ctx.createLinearGradient(0, y0, 0, y0 + fade);
    g.addColorStop(0, css(P.ochre, i === 0 ? 0.55 : 0.8));
    g.addColorStop(0.8, css(P.silk, 1));
    g.addColorStop(1, css(P.silk, 0));
    ctx.fillStyle = g;
    ctx.fillRect(x, y0, 2, fade);
  }
  // canopy dabs — the autumn mosaic
  noStroke();
  const hazeAmt = i === 0 ? 0.35 : 0.08;
  const nDabs = i === 0 ? 5200 : 6800;
  for (let k = 0; k < nDabs; k++) {
    const x = random(width);
    const depth = pow(random(), 1.6);                    // cluster near ridgeline
    const y = ridge[floor(x)] + depth * (baseline - ridge[floor(x)] + 14);
    if (y > baseline + 10) continue;
    const pick = AUTUMN[floor(noise(x * 0.006, y * 0.02, i * 9.1) * AUTUMN.length * 1.4) % AUTUMN.length];
    let c = lerpColor(col(P[pick]), col(P.haze), hazeAmt + random(-0.05, 0.12));
    c.setAlpha(random(120, 210));
    fill(c);
    const s = random(1.6, i === 0 ? 3.4 : 4.6);
    ellipse(x, y, s, s * random(0.7, 1.1));
  }
  // sparse dark conifer ticks
  stroke(P.ink[0], P.ink[1], P.ink[2], i === 0 ? 60 : 110);
  strokeWeight(0.8);
  for (let x = 10; x < width - 10; x += 8) {
    if (random() < 0.35) {
      const y = ridge[x] + random(0, (baseline - ridge[x]) * 0.6);
      line(x, y, x, y - random(4, 9));
    }
  }
  return ridge;
}

// -------------------------------------- travertine terraces / pools
function paintPools(shoreRidge) {
  // rimstone dams: gently scalloped noisy curves
  const rimBases = [0.575, 0.70, 0.83, 1.02];
  const rims = rimBases.map((b, k) => {
    const r = new Float32Array(width + 1);
    for (let x = 0; x <= width; x++) {
      r[x] = b * height
           + (noise(x * 0.004 + k * 91.7) - 0.5) * 26
           + sin(x * 0.02 + k * 5) * 2.5;
    }
    return r;
  });

  // pools, far to near
  for (let k = 0; k < rims.length; k++) {
    const topLine = k === 0
      ? (x) => max(height * 0.555, shoreRidge ? height * 0.555 : height * 0.555)
      : (x) => rims[k - 1][x];
    for (let x = 0; x <= width; x += 2) {
      const y0 = k === 0 ? height * 0.555 : rims[k - 1][x];
      const y1 = min(rims[k][x], height);
      if (y1 - y0 < 3) continue;

      // color field: the Five Flower Lake patchwork
      const n = noise(x * 0.0032, k * 37.7 + x * 0.0006);
      const m = noise(x * 0.009 + 500, k * 11.1);
      let c;
      if (n < 0.36)      c = lerpColor(col(P.deepTeal),  col(P.turquoise), m);
      else if (n < 0.62) c = lerpColor(col(P.turquoise), col(P.jade),      m);
      else               c = lerpColor(col(P.jade),      col(P.paleCyan),  m);

      const shallow = lerpColor(col(P.paleCyan), col(P.travertine), 0.35);
      const g = ctx.createLinearGradient(0, y0, 0, y1);
      g.addColorStop(0, css([red(c) * 0.8 + 30, green(c) * 0.8 + 30, blue(c) * 0.8 + 30], 0.92));
      g.addColorStop(0.5, c.toString());
      g.addColorStop(1, shallow.toString());
      ctx.fillStyle = g;
      ctx.fillRect(x, y0, 2, y1 - y0);
    }

    poolDetails(k === 0 ? null : rims[k - 1], rims[k], k);
    paintRim(rims[k], k);
  }
}

function poolDetails(rimTop, rimBottom, k) {
  const topAt = (x) => rimTop ? rimTop[x] : height * 0.555;

  // forest reflection strokes just below the far edge
  noStroke();
  for (let j = 0; j < 900; j++) {
    const x = floor(random(width));
    const y0 = topAt(x);
    const y = y0 + random(2, 22);
    if (y > rimBottom[x] - 4) continue;
    const pick = AUTUMN[floor(random(AUTUMN.length))];
    const c = col(P[pick], random(26, 60));
    fill(c);
    rect(x, y, random(1, 2), random(3, 9));
  }

  // sunken tree trunks — pale bones under turquoise
  const nLogs = floor(random(3, 7));
  for (let j = 0; j < nLogs; j++) {
    const x = random(width * 0.05, width * 0.95);
    const y0 = topAt(floor(x));
    const yb = rimBottom[floor(x)];
    if (yb - y0 < 24) continue;
    const y = random(y0 + 14, yb - 8);
    const len = random(50, 150);
    const ang = random(-0.12, 0.12);
    push();
    translate(x, y); rotate(ang);
    stroke(196, 172, 128, 85); strokeWeight(3.2);
    line(-len / 2, 0, len / 2, 0);
    stroke(228, 210, 168, 55); strokeWeight(1.2);
    line(-len / 2, -1.4, len / 2, -1.4);
    // stub branches
    stroke(196, 172, 128, 70); strokeWeight(1.4);
    for (let b = 0; b < 3; b++) {
      const bx = random(-len / 2, len / 2);
      line(bx, 0, bx + random(-8, 8), random(-10, -4));
    }
    pop();
  }

  // faint surface ripples
  strokeWeight(0.6);
  for (let j = 0; j < 60; j++) {
    const x = random(width);
    const y0 = topAt(floor(x));
    const yb = rimBottom[floor(x)];
    if (yb - y0 < 10) continue;
    const y = random(y0 + 4, yb - 4);
    stroke(235, 245, 240, random(20, 44));
    const len = random(20, 70);
    line(x, y, x + len, y + random(-0.5, 0.5));
  }
}

// rimstone dam: pale travertine lip + cascade ticks spilling over
function paintRim(rim, k) {
  if (rim[0] > height + 4) return;
  stroke(P.travertine[0], P.travertine[1], P.travertine[2], 200);
  strokeWeight(2.2);
  noFill();
  beginShape();
  for (let x = 0; x <= width; x += 3) vertex(x, min(rim[x], height));
  endShape();
  stroke(P.ink[0], P.ink[1], P.ink[2], 40);
  strokeWeight(0.6);
  beginShape();
  for (let x = 0; x <= width; x += 3) vertex(x, min(rim[x] + 2.2, height));
  endShape();
  // white water spilling over the lip
  strokeWeight(1);
  for (let x = 4; x < width - 4; x += 3) {
    if (rim[x] > height) continue;
    if (noise(x * 0.02 + k * 33.3) > 0.42 && random() < 0.75) {
      stroke(244, 248, 244, random(90, 170));
      line(x, rim[x] + 1, x + random(-1, 1), rim[x] + random(5, 13));
    }
  }
}

// --------------------------------------------- the big waterfall
function paintWaterfall(shoreRidge) {
  const cx = random(width * 0.12, width * 0.34);
  const wHalf = random(36, 60);
  const yTop = shoreRidge[floor(cx)] + 4;
  const yBot = height * 0.575;
  if (yBot - yTop < 20) return;

  // curtain of streaks
  for (let x = cx - wHalf; x < cx + wHalf; x += 2) {
    const edge = 1 - abs(x - cx) / wHalf;
    if (noise(x * 0.05 + 77.7) < 0.3) continue;
    stroke(246, 250, 246, 60 + 130 * edge);
    strokeWeight(random(0.8, 1.6));
    const jit = random(-1.5, 1.5);
    line(x, yTop + random(0, 4), x + jit, yBot - random(0, 5));
  }
  // mist at the plunge
  noStroke();
  for (let j = 0; j < 26; j++) {
    fill(244, 248, 244, random(8, 22));
    ellipse(cx + random(-wHalf, wHalf) * 1.2, yBot + random(-4, 8),
            random(14, 44), random(6, 14));
  }
  // dark rock flanks
  stroke(P.ink[0], P.ink[1], P.ink[2], 90);
  strokeWeight(1.2);
  line(cx - wHalf - 2, yTop, cx - wHalf - 4, yBot);
  line(cx + wHalf + 2, yTop, cx + wHalf + 4, yBot);
}

// ----------------------------------------------- shoreline trees
function paintShoreTrees(ridge) {
  for (let x = 14; x < width - 14; x += 9) {
    if (noise(x * 0.04 + 300.3) < 0.52 || random() > 0.6) continue;
    const y = ridge[x] + random(-2, 4);
    if (y > height * 0.555) continue;
    const s = random(0.9, 1.5);
    stroke(P.ink[0], P.ink[1], P.ink[2], 160);
    strokeWeight(0.9 * s);
    line(x, y + 1, x + random(-1, 1), y - 7 * s);
    noStroke();
    const pick = random() < 0.4 ? 'pine' : random(['gold', 'crimson', 'amber']);
    fill(P[pick][0], P[pick][1], P[pick][2], 205);
    for (let k = 0; k < 5; k++) {
      ellipse(x + random(-3.5, 3.5) * s, y - (5 + random(5)) * s,
              random(2.2, 4) * s, random(1.8, 3) * s);
    }
  }
}

// ------------------------------------------------- grain + vignette
function paintGrain() {
  for (let y = 0; y < height; y += 3) {
    stroke(90, 70, 45, 5);
    line(0, y, width, y);
  }
  strokeWeight(1);
  for (let k = 0; k < 5600; k++) {
    stroke(random() < 0.5 ? color(58, 44, 26, random(4, 13))
                          : color(232, 212, 166, random(4, 11)));
    point(random(width), random(height));
  }
  const g = ctx.createLinearGradient(0, 0, 0, height);
  g.addColorStop(0, 'rgba(56,40,22,0.30)');
  g.addColorStop(0.10, 'rgba(56,40,22,0)');
  g.addColorStop(0.92, 'rgba(56,40,22,0)');
  g.addColorStop(1, 'rgba(56,40,22,0.30)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, width, height);
  const gx = ctx.createLinearGradient(0, 0, width, 0);
  gx.addColorStop(0, 'rgba(56,40,22,0.26)');
  gx.addColorStop(0.04, 'rgba(56,40,22,0)');
  gx.addColorStop(0.96, 'rgba(56,40,22,0)');
  gx.addColorStop(1, 'rgba(56,40,22,0.26)');
  ctx.fillStyle = gx; ctx.fillRect(0, 0, width, height);
}

// ------------------------------------------------------ collector seal
function paintSeal() {
  const s = 26;
  const x = width - 54, y = height * 0.14;
  noStroke();
  fill(P.seal[0], P.seal[1], P.seal[2], 216);
  rect(x, y, s, s, 2.5);
  stroke(P.silk[0], P.silk[1], P.silk[2], 235);
  strokeWeight(1.6);
  noFill();
  line(x + 6,  y + 6,  x + 6,  y + 20);
  line(x + 6,  y + 13, x + 12, y + 13);
  line(x + 12, y + 6,  x + 12, y + 20);
  line(x + 17, y + 6,  x + 21, y + 6);
  line(x + 19, y + 6,  x + 19, y + 16);
  line(x + 16, y + 20, x + 21, y + 16);
}
</script>
</body>
</html>
